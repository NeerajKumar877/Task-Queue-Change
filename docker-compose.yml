version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: task_queue_redis
    ports:
      - "6379:6379"
    restart: always
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: task_queue_backend
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    restart: always

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: task_queue_worker
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CONCURRENCY=3
    depends_on:
      - redis
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: task_queue_frontend
    ports:
      - "3001:80"
    depends_on:
      - backend
    restart: always

volumes:
  redis_data:
